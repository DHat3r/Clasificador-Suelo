<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clasificador de uso de suelo</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1d2630;
      --muted: #5b6774;
      --accent: #2e7d4f;
      --accent-hover: #256740;
      --bar: #3a8fb7;
      --bar-bg: #e3e8ed;
      --error: #b3261e;
      --error-bg: #fdecea;
      --border: #d5dde5;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14181d;
        --card: #1e252d;
        --text: #e6ebf0;
        --muted: #9aa6b2;
        --accent: #4caf7a;
        --accent-hover: #5fc38b;
        --bar: #5cb3dd;
        --bar-bg: #2c353f;
        --error: #ff8a80;
        --error-bg: #3a1f1d;
        --border: #34404c;
      }
    }

    :root[data-theme="dark"] {
      --bg: #14181d;
      --card: #1e252d;
      --text: #e6ebf0;
      --muted: #9aa6b2;
      --accent: #4caf7a;
      --accent-hover: #5fc38b;
      --bar: #5cb3dd;
      --bar-bg: #2c353f;
      --error: #ff8a80;
      --error-bg: #3a1f1d;
      --border: #34404c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px;
    }

    main {
      width: 100%;
      max-width: 560px;
      margin-top: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
    }

    .subtitulo {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .campo-archivo input[type="file"] {
      width: 100%;
      color: var(--text);
    }

    .vista-previa {
      display: none;
      margin-top: 16px;
      text-align: center;
    }

    .vista-previa.visible {
      display: block;
    }

    .vista-previa img {
      max-width: 100%;
      max-height: 320px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    button#clasificar {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button#clasificar:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button#clasificar:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .estado {
      margin-top: 12px;
      min-height: 1.2em;
      color: var(--muted);
      text-align: center;
    }

    .error {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: var(--error-bg);
      color: var(--error);
      display: none;
    }

    .error.visible {
      display: block;
    }

    .resultado {
      margin-top: 20px;
      display: none;
    }

    .resultado.visible {
      display: block;
    }

    .clase-predicha {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
    }

    .confianza {
      margin: 4px 0 16px;
      color: var(--muted);
    }

    .fila-barra {
      display: grid;
      grid-template-columns: 9rem 1fr 3.5rem;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .fila-barra .nombre {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pista {
      height: 12px;
      background: var(--bar-bg);
      border-radius: 6px;
      overflow: hidden;
    }

    .relleno {
      height: 100%;
      width: 0;
      background: var(--bar);
      border-radius: 6px;
      transition: width 0.3s ease;
    }

    .fila-barra .valor {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 420px) {
      main { padding: 16px; }
      .fila-barra { grid-template-columns: 6rem 1fr 3rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Clasificador de uso de suelo</h1>
    <p class="subtitulo">Sube una imagen satelital (JPG o PNG) y obtén el tipo de uso de suelo estimado.</p>

    <div class="campo-archivo">
      <input type="file" id="archivo" accept="image/jpeg,image/png">
    </div>

    <div class="vista-previa" id="vista-previa">
      <img id="imagen-previa" alt="Vista previa de la imagen seleccionada">
    </div>

    <button type="button" id="clasificar" disabled>Clasificar</button>

    <p class="estado" id="estado" aria-live="polite"></p>

    <div class="error" id="error" role="alert"></div>

    <section class="resultado" id="resultado">
      <p class="clase-predicha" id="clase-predicha"></p>
      <p class="confianza" id="confianza"></p>
      <div id="barras"></div>
    </section>
  </main>

  <script>
    const inputArchivo = document.getElementById('archivo');
    const contenedorPrevia = document.getElementById('vista-previa');
    const imagenPrevia = document.getElementById('imagen-previa');
    const boton = document.getElementById('clasificar');
    const estado = document.getElementById('estado');
    const cajaError = document.getElementById('error');
    const resultado = document.getElementById('resultado');
    const clasePredicha = document.getElementById('clase-predicha');
    const confianza = document.getElementById('confianza');
    const barras = document.getElementById('barras');

    let urlPrevia = null;

    function mostrarError(mensaje) {
      cajaError.textContent = mensaje;
      cajaError.classList.add('visible');
    }

    function ocultarError() {
      cajaError.textContent = '';
      cajaError.classList.remove('visible');
    }

    function ocultarResultado() {
      resultado.classList.remove('visible');
      clasePredicha.textContent = '';
      confianza.textContent = '';
      barras.textContent = '';
    }

    inputArchivo.addEventListener('change', () => {
      const archivo = inputArchivo.files[0];
      ocultarError();
      ocultarResultado();

      if (urlPrevia) {
        URL.revokeObjectURL(urlPrevia);
        urlPrevia = null;
      }

      if (!archivo) {
        contenedorPrevia.classList.remove('visible');
        imagenPrevia.removeAttribute('src');
        boton.disabled = true;
        return;
      }

      urlPrevia = URL.createObjectURL(archivo);
      imagenPrevia.src = urlPrevia;
      contenedorPrevia.classList.add('visible');
      boton.disabled = false;
    });

    function pintarBarras(probabilidades) {
      barras.textContent = '';
      const entradas = Object.entries(probabilidades)
        .sort((a, b) => b[1] - a[1]);

      for (const [clase, probabilidad] of entradas) {
        const porcentaje = (probabilidad * 100).toFixed(1);

        const fila = document.createElement('div');
        fila.className = 'fila-barra';

        const nombre = document.createElement('span');
        nombre.className = 'nombre';
        nombre.textContent = clase;

        const pista = document.createElement('div');
        pista.className = 'pista';

        const relleno = document.createElement('div');
        relleno.className = 'relleno';
        relleno.style.width = '0%';
        pista.appendChild(relleno);

        const valor = document.createElement('span');
        valor.className = 'valor';
        valor.textContent = porcentaje + ' %';

        fila.append(nombre, pista, valor);
        barras.appendChild(fila);

        // Se anima el ancho tras insertar la fila para que la transición se note.
        requestAnimationFrame(() => {
          relleno.style.width = porcentaje + '%';
        });
      }
    }

    boton.addEventListener('click', async () => {
      const archivo = inputArchivo.files[0];
      if (!archivo) {
        mostrarError('Primero selecciona una imagen.');
        return;
      }

      ocultarError();
      ocultarResultado();
      boton.disabled = true;
      estado.textContent = 'Clasificando...';

      try {
        const formData = new FormData();
        formData.append('file', archivo);

        const respuesta = await fetch('/predict', {
          method: 'POST',
          body: formData
        });

        let datos = null;
        try {
          datos = await respuesta.json();
        } catch (errorJson) {
          datos = null;
        }

        if (!respuesta.ok) {
          const detalle = datos && datos.detail
            ? datos.detail
            : 'Error al clasificar la imagen (HTTP ' + respuesta.status + ').';
          mostrarError(typeof detalle === 'string' ? detalle : JSON.stringify(detalle));
          return;
        }

        clasePredicha.textContent = 'Clase predicha: ' + datos.prediction;
        confianza.textContent = 'Confianza: ' + (datos.confidence * 100).toFixed(1) + ' %';
        pintarBarras(datos.probabilities);
        resultado.classList.add('visible');
      } catch (error) {
        mostrarError('No se pudo conectar con el servidor. Inténtalo de nuevo.');
      } finally {
        estado.textContent = '';
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
